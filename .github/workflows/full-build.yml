name: ESP-IDF full build

on:
  workflow_dispatch:
    inputs:
      idf_version:
        description: ESP-IDF version
        type: choice
        options: ['6.2', '6.1']
        default: '6.2'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: full-build-${{ github.ref }}-${{ inputs.idf_version || '6.2' }}
  cancel-in-progress: true

env:
  IDF_REVISION: ${{ inputs.idf_version == '6.1' && '051e4c4eb20346e043cdd47bc388fde75ff8af63' || '2b10d1278a547f5dc92efbe516144b4ae85f80cb' }}
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-esp32s31
        with:
          install_tools: false
      - name: Run host tests
        run: python3 -m unittest discover -s tests -v

  examples:
    name: Examples (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [core, camera, camera-models-1, camera-models-2, expansion, system]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-esp32s31
      - name: Build complete example group
        env:
          BUILD_GROUP: ${{ matrix.group }}
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 tools/ci_matrix.py build --group "$BUILD_GROUP"
