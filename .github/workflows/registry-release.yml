name: ESP Component Registry

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to validate or publish
        type: choice
        required: true
        default: candis
        options:
          - candis
          - candis-camera
          - candis-dock
          - tg28-esp
      publish:
        description: Publish the selected component after all validation passes
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: registry-${{ inputs.component }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  IDF_REVISION: 2b10d1278a547f5dc92efbe516144b4ae85f80cb
  REGISTRY_NAMESPACE: jlclab

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-esp32s31
        with:
          install_tools: false
      - name: Ensure host test dependencies
        run: |
          python3 -c 'import yaml' || {
            sudo apt-get update
            sudo apt-get install -y python3-yaml
          }
      - name: Run host tests
        run: python3 -m unittest discover -s tests -v

  validate:
    name: Validate ${{ inputs.component }} (ESP-IDF ${{ matrix.idf_version }})
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - idf_version: '6.1'
            idf_revision: 051e4c4eb20346e043cdd47bc388fde75ff8af63
          - idf_version: '6.2'
            idf_revision: 2b10d1278a547f5dc92efbe516144b4ae85f80cb
    env:
      IDF_REVISION: ${{ matrix.idf_revision }}
      COMPONENT: ${{ inputs.component }}
      RELEASE_DIR: ${{ github.workspace }}/.registry-release/validate-${{ matrix.idf_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-esp32s31
      - name: Validate release metadata
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 tools/registry_release.py validate --component "$COMPONENT"
      - name: Stage and pack the component with required dependencies
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 tools/registry_release.py prepare \
            --component "$COMPONENT" \
            --output-dir "$RELEASE_DIR" \
            --commit-sha "$GITHUB_SHA"
      - name: Validate the component archive with the Registry service
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          source_dir="components/$COMPONENT"
          if [[ -d "$RELEASE_DIR/staging/$COMPONENT" ]]; then
            source_dir="$RELEASE_DIR/staging/$COMPONENT"
          fi
          python3 tools/registry_release.py dry-run \
            --component "$COMPONENT" \
            --source-dir "$source_dir" \
            --commit-sha "$GITHUB_SHA" \
            --output-dir "$RELEASE_DIR/dry-run"
      - name: Build an independent consumer from the packed component
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 tools/registry_release.py build-consumer \
            --component "$COMPONENT" \
            --plan "$RELEASE_DIR/plan.json" \
            --output-dir "$RELEASE_DIR/package-consumer" \
            --mode package \
            --commit-sha "$GITHUB_SHA"

  publish:
    name: Publish ${{ inputs.component }} with OIDC
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: registry
    permissions:
      contents: read
      id-token: write
    env:
      IDF_REVISION: 2b10d1278a547f5dc92efbe516144b4ae85f80cb
      COMPONENT: ${{ inputs.component }}
      RELEASE_DIR: ${{ github.workspace }}/.registry-release/publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-esp32s31
      - name: Verify the release tag and manifest are consistent
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 tools/registry_release.py validate \
            --component "$COMPONENT" \
            --require-tag \
            --commit-sha "$GITHUB_SHA"
      - name: Stage and pack the component with required dependencies
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 tools/registry_release.py prepare \
            --component "$COMPONENT" \
            --output-dir "$RELEASE_DIR" \
            --commit-sha "$GITHUB_SHA"
      - name: Reject an already published version
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          source_dir="components/$COMPONENT"
          if [[ -d "$RELEASE_DIR/staging/$COMPONENT" ]]; then
            source_dir="$RELEASE_DIR/staging/$COMPONENT"
          fi
          python3 tools/registry_release.py check-version \
            --component "$COMPONENT" \
            --source-dir "$source_dir" \
            --commit-sha "$GITHUB_SHA" \
            --output-dir "$RELEASE_DIR/version-check"
      - name: Build an independent consumer from the packed component
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 tools/registry_release.py build-consumer \
            --component "$COMPONENT" \
            --plan "$RELEASE_DIR/plan.json" \
            --output-dir "$RELEASE_DIR/package-consumer" \
            --mode package \
            --commit-sha "$GITHUB_SHA"
      - name: Make the staged component visible to the pinned Docker action
        run: |
          python3 tools/registry_release.py promote-stage \
            --component "$COMPONENT" \
            --prepared-dir "$RELEASE_DIR" \
            --repository-root "$GITHUB_WORKSPACE"
      - name: Upload the validated component with OIDC
        uses: espressif/upload-components-ci-action@2ce17d73e35473317c1419dbd4f007aacb593040 # v2.2.1
        with:
          namespace: jlclab
          components: "${{ inputs.component }}:components/${{ inputs.component }}"
          repository_url: https://github.com/jlclab-io/candis-bsp.git
      - name: Install the published component from the Registry and build
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 tools/registry_release.py build-consumer \
            --component "$COMPONENT" \
            --plan "$RELEASE_DIR/plan.json" \
            --output-dir "$RELEASE_DIR/registry-consumer" \
            --mode registry \
            --commit-sha "$GITHUB_SHA"
      - name: Record the published component identity
        run: |
          version="$(python3 -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["version"])' "components/$COMPONENT/idf_component.yml")"
          printf 'PUBLISHED_COMPONENT=%s\nPUBLISHED_VERSION=%s\nPUBLISHED_COMMIT=%s\n' \
            "$COMPONENT" "$version" "$GITHUB_SHA" | tee "$RELEASE_DIR/registry-result.txt"
