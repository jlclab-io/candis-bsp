name: ESP-IDF CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IDF_REVISION: 2b10d1278a547f5dc92efbe516144b4ae85f80cb
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      groups: ${{ steps.plan.outputs.groups }}
      matrix_groups: ${{ steps.plan.outputs.matrix_groups }}
      host_tests: ${{ steps.plan.outputs.host_tests }}
      docs_check: ${{ steps.plan.outputs.docs_check }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Plan changed-scope builds
        id: plan
        run: |
          plan="$(python3 tools/ci_matrix.py plan)"
          builds="$(python3 -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["builds"], separators=(",", ":")))' "$plan")"
          groups="$(python3 -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["groups"], separators=(",", ":")))' "$plan")"
          matrix_groups="$groups"
          if [[ "$matrix_groups" == '[]' ]]; then
            matrix_groups='["none"]'
          fi
          host_tests="$(python3 -c 'import json,sys; print(str(json.loads(sys.argv[1])["host_tests"]).lower())' "$plan")"
          docs_check="$(python3 -c 'import json,sys; print(str(json.loads(sys.argv[1])["docs_check"]).lower())' "$plan")"
          printf 'builds=%s\ngroups=%s\nmatrix_groups=%s\nhost_tests=%s\ndocs_check=%s\n' \
            "$builds" "$groups" "$matrix_groups" "$host_tests" "$docs_check" >> "$GITHUB_OUTPUT"
          printf 'Selected ESP-IDF groups: %s\n' "$groups"

  markdown:
    needs: checks
    if: needs.checks.outputs.docs_check == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check repository-local Markdown links and anchors
        run: python3 tools/check_markdown_links.py

  host-tests:
    needs: checks
    if: needs.checks.outputs.host_tests == 'true' && needs.checks.outputs.builds == '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-esp32s31
        with:
          install_tools: false
      - name: Run host tests
        run: python3 -m unittest discover -s tests -v

  idf61-smoke:
    name: ESP-IDF 6.1 compatibility
    needs: checks
    if: needs.checks.outputs.builds != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IDF_REVISION: 051e4c4eb20346e043cdd47bc388fde75ff8af63 # v6.1.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-esp32s31
      - name: Build representative applications
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 tools/ci_matrix.py build --targets '["candis_minimal:default","display:default","bsp_api:default","rtc:default","bleprph_wifi_coex:default"]'

  compile:
    needs: checks
    if: needs.checks.outputs.groups != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.checks.outputs.matrix_groups) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-esp32s31
      - name: Run host tests
        if: needs.checks.outputs.host_tests == 'true' && matrix.group == fromJSON(needs.checks.outputs.groups)[0]
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 -m unittest discover -s tests -v
      - name: Build affected examples
        env:
          BUILD_PLAN: ${{ needs.checks.outputs.builds }}
          BUILD_GROUP: ${{ matrix.group }}
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python3 tools/ci_matrix.py build --targets "$BUILD_PLAN" --only-group "$BUILD_GROUP"
