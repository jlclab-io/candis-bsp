version: "0.1.0"
description: Configurable OV5640 DVP capture with an optional Candis board preset
license: Apache-2.0
url: https://github.com/jlclab-io/candis-bsp/tree/main/components/candis_ov5640
repository: https://github.com/jlclab-io/candis-bsp.git
repository_info:
  path: components/candis_ov5640
targets:
  - esp32s31
dependencies:
  idf: ">=6.2,<6.3"
  candis:
    path: ../candis
    rules:
      - if: $CONFIG{CANDIS_OV5640_FIXTURE} == True
  espressif/esp_video: "2.5.0"
  espressif/esp_cam_sensor: "2.6.0"
